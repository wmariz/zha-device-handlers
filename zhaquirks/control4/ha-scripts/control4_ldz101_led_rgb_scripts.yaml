# Control4 LDZ-101 dimmer / LSZ-101 switch / KPZ-6B1 keypad — "Set All LEDs"
#
# Loaded automatically with `script control4: !include_dir_merge_named
# custom_zha_quirks/control4/ha-scripts` in configuration.yaml (see the
# README), or paste into scripts.yaml / the HA Script editor (YAML mode).
#
# Both device families expose the same "set all LEDs" command (endpoint 197,
# cluster 0xFC48/64584, command 0: red, green, blue), which sends the
# requested RGB bytes to the LEDs unchanged:
#   - LDZ-101 / LSZ-101: C4DimmerAllLedCluster (c4_led_rgb.py) — sends
#     c4.dm.l0o/l1o/l0f/l1f (top/bottom on-/off-color), CONFIRMED from real
#     HC300 controller logs of Control4's own SET_ALL_LED. Each LED is its
#     own wire command, so the quirk skips LEDs whose light entity is
#     disabled in Home Assistant (fewest commands, fastest response).
#   - KPZ-6B1: C4KeypadAllLedCluster (c4_keypad_led_rgb.py) — one
#     `c4.kp.lv ff ff <c>x6` frame (CONFIRMED from a Composer
#     "SET_ALL_LED_COLOR" capture), always with all 6 colors.
#
# This used to call light.turn_on(rgb_color=...) on the dimmer's LED
# entities instead. Home Assistant converts that RGB to xy, keeping only
# hue/saturation, so every dark color reached the LED at full brightness
# (e.g. (1,1,1) -> ffffff) — the direct command avoids that.


# ==========================================================================
# Set All LEDs — LDZ-101/LSZ-101 (enabled LEDs) or KPZ-6B1 (all 6), one RGB
# ==========================================================================
control4_ldz101_set_all_leds:
  alias: "Control4: Set All LEDs"
  description: >-
    Set the LEDs of a Control4 LDZ-101 dimmer, LSZ-101 switch or KPZ-6B1
    keypad to the same exact RGB. Keypad: all 6 in one frame. Dimmer/
    switch: only the LEDs whose entity is enabled. Just pick the device.
  icon: mdi:led-strip-variant
  mode: single
  fields:
    target_device:
      name: Control4 LDZ-101 dimmer, LSZ-101 switch or KPZ-6B1 keypad
      description: "Select the ZHA device — LDZ-101, LSZ-101 or KPZ-6B1 only"
      required: true
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Control4
              model: LDZ-101
            - integration: zha
              manufacturer: Control4
              model: LSZ-101
            - integration: zha
              manufacturer: Control4
              model: KPZ-6B1
    color:
      name: Color
      description: "LED color"
      required: true
      default: [255, 0, 0]
      selector:
        color_rgb:
  variables:
    ieee: >-
      {{ (device_attr(target_device, 'identifiers') | list)[0][1] }}
    # Enabled LED light entities (device_entities() only lists ENABLED
    # entities; LED lights are the device's xy-color lights). Used only for
    # the UI refresh below.
    led_entities: >-
      {{ device_entities(target_device)
         | select('match', '^light\\.')
         | select('in', states.light
             | selectattr('attributes.supported_color_modes', 'defined')
             | selectattr('attributes.supported_color_modes', 'contains', 'xy')
             | map(attribute='entity_id') | list)
         | list }}
  sequence:
    - action: zha.issue_zigbee_cluster_command
      data:
        ieee: "{{ ieee }}"
        endpoint_id: 197
        cluster_id: 64584
        cluster_type: in
        command: 0
        command_type: server
        params:
          red: "{{ color[0] | int(0) }}"
          green: "{{ color[1] | int(0) }}"
          blue: "{{ color[2] | int(0) }}"
    # ZHA's light platform only re-reads a Color cluster's current_x/
    # current_y on a 45-75 MINUTE periodic poll — it never reacts to the
    # raw wire command above. Force that poll now so the light cards
    # catch up to the color just sent.
    - if: "{{ led_entities | count > 0 }}"
      then:
        - action: homeassistant.update_entity
          target:
            entity_id: "{{ led_entities }}"
