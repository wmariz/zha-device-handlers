# Control4 APD120/LDZ-101 dimmer — RGB LED-color scripts for Home Assistant
#
# Add these to your scripts.yaml or paste into the HA Script editor (YAML mode).
#
# Unlike control4_led_scripts.yaml (which targets C4LEDCluster/c4.dmx.led on
# endpoint 3 — the KC120277 scene-controller's protocol, very likely
# non-functional on the LDZ-101 dimmer's own LEDs), these scripts target the
# real per-button RGB "light" entities this quirk exposes (c4_led_rgb.py,
# endpoints 202/203), which speak the LDZ-101's own confirmed
# c4.dm.l0o/c4.dm.l1o wire protocol.
#
# CONFIRMED from two real HC300 controller logs: Control4's own SET_ALL_LED
# command sets FOUR wire commands at once — c4.dm.l0o/l0f (top on/off-color)
# and c4.dm.l1o/l1f (bottom on/off-color) — all to the same RGB. This quirk
# only exposes the two "on"-color commands as light entities so far (per an
# explicit scoping decision — the LED only follows these commands while
# led_attached is off; see c4_attached_switch.py), so
# control4_ldz101_set_all_leds below only sets the two on-color entities.
# The off-color commands (l0f/l1f) are confirmed on the wire but not wired to
# any entity or service yet.
#
# Prerequisites:
#   - ZHA integration with the control4 quirks branch loaded
#   - The two RGB light entities from c4_led_rgb.py present on the target
#     device (endpoints 202 "top", 203 "bottom")


# ==========================================================================
# Set All LEDs (on-color) — both buttons, one RGB
# ==========================================================================
control4_ldz101_set_all_leds:
  alias: "Control4 LDZ-101: Set All LEDs (on-color)"
  description: >-
    Set both button LEDs' "on" color to the same RGB in one call —
    replicates the on-color half of Control4's own SET_ALL_LED command.
    Pick the top and bottom LED light entities for one specific dimmer,
    then a color.
  icon: mdi:led-strip-variant
  mode: single
  fields:
    top_led:
      name: Top LED light entity
      description: "The dimmer's top-button LED light entity (endpoint 202)"
      required: true
      selector:
        entity:
          domain: light
    bottom_led:
      name: Bottom LED light entity
      description: "The dimmer's bottom-button LED light entity (endpoint 203)"
      required: true
      selector:
        entity:
          domain: light
    color:
      name: Color
      description: "LED color for both buttons"
      required: true
      default: [255, 0, 0]
      selector:
        color_rgb:
  sequence:
    - service: light.turn_on
      target:
        entity_id: "{{ top_led }}"
      data:
        rgb_color: "{{ color }}"
    - service: light.turn_on
      target:
        entity_id: "{{ bottom_led }}"
      data:
        rgb_color: "{{ color }}"
